    />
    <meta name="twitter:image" content="%SITE_URL%/images/og-cover.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Ханз Академи · Hanz Academy Mongolia",
        "url": "%SITE_URL%/",
        "logo": "%SITE_URL%/images/logo-official.webp",
        "image": "%SITE_URL%/images/og-cover.jpg",
        "foundingDate": "2014",
        "description": "Хятад хэл, HSK/HSKK бэлтгэл, Хятадад тэтгэлгээр суралцах зөвлөгөө.",
        "telephone": "+976-9990-7748",

        ],

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Onest:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@700&display=swap"
      rel="stylesheet"
    />
    <title>Ханз Академи · Hanz Academy Mongolia</title>
    <script>
      // Apply the site theme before first paint, so the header never flashes the
      // old white style before React mounts (lib/theme.ts keeps it in sync after).
      (function () {
        if (location.pathname.indexOf("/admin") === 0) return;
        var root = document.documentElement;
        var theme = "light";
        try {
          if (localStorage.getItem("hanz-theme") === "dark") theme = "dark";
        } catch (e) {}
        root.classList.add("site");
        root.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
